name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 1. Wichtig: fetch-depth: 0 hinzugefügt, damit vergen den Git-SHA auslesen kann
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Rust Nightly Toolchain mit 32-bit MSVC Target
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: i686-pc-windows-msvc

      # 3. Cargo-Abhängigkeiten cachen
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # 4. Release-Skript ausführen
      - name: Run release script
        run: .\release.ps1 -Configuration release
        shell: pwsh

      # 5. Build-Ordner als ZIP archivieren
      - name: Archive build output
        run: Compress-Archive -Path .\build\* -DestinationPath falke-release.zip
        shell: pwsh

      # 6. Build-Artefakt hochladen
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: falke-build
          path: falke-release.zip

      # 7. GitHub Release erstellen (bei Push von v*-Tags)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: falke-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}